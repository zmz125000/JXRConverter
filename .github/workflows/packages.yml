name: Build desktop packages
on:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux-x86_64
            qt_arch: gcc_64
            qt_archives: qtbase icu
          - os: macos-14
            platform: macOS-arm64
            qt_arch: clang_64
            qt_archives: qtbase
          - os: windows-2022
            platform: Windows-x86_64
            qt_arch: win64_msvc2022_64
            qt_archives: qtbase
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y ninja-build nasm patchelf
          libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4
          libxcb-keysyms1 libxcb-image0 libxcb-render-util0
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja nasm
      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm ninja -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nasm = Join-Path $env:ProgramFiles 'NASM'
          if (!(Test-Path (Join-Path $nasm 'nasm.exe'))) { throw "NASM installation not found" }
          $nasm | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Qt runtime and development files
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.12.0'
          arch: ${{ matrix.qt_arch }}
          archives: ${{ matrix.qt_archives }}
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DJXRC_BUILD_GUI=ON -DJXRC_DEPLOY_QT=ON -DCMAKE_INSTALL_LIBDIR=lib
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/check_release_version.py "${{ github.ref_name }}" build/generated/jxrc/version.hpp
      - name: Build
        run: cmake --build build --target jxrconverter jxrconvert jxrc_gui_tests jxrc_tests -j 3
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - name: Package GUI, CLI and runtime dependencies
        working-directory: build
        run: cpack -C Release
      - name: Smoke test extracted package
        run: python tools/smoke_package.py build
      - name: Upload downloadable desktop package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: JXRConverter-${{ matrix.platform }}
          path: |
            build/JXRConverter-*.zip
            build/JXRConverter-*.tar.gz
          if-no-files-found: error
          retention-days: 14
