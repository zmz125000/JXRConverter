name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  packages:
    uses: ./.github/workflows/packages.yml
  publish:
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: JXRConverter-*
          merge-multiple: true
          path: assets
      - name: Checksums
        working-directory: assets
        run: sha256sum JXRConverter-* > SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: JXRConverter ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            assets/JXRConverter-*.zip
            assets/JXRConverter-*.tar.gz
            assets/SHA256SUMS.txt
