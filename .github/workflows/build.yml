name: Native library, CLI and GUI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    uses: ./.github/workflows/packages.yml
  desktop-distro:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Distro compatibility dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build nasm qt6-base-dev libexiv2-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJXRC_BUILD_GUI=ON -DJXRC_USE_SYSTEM_EXIV2=ON
      - name: Build
        run: cmake --build build --target jxrconverter jxrc_gui_tests jxrconvert jxrc_tests -j 3
      - name: Test offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
